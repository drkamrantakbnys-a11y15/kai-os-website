<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project KAI — KAI OS, a modular AI operating system">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b18" />
      <stop offset="55%" stop-color="#08111f" />
      <stop offset="100%" stop-color="#050b18" />
    </linearGradient>
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="glowOne" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowTwo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="220" cy="140" r="320" fill="url(#glowOne)" />
  <circle cx="1000" cy="520" r="320" fill="url(#glowTwo)" />

  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="rgba(148,163,184,0.16)" stroke-width="1" />

  <circle cx="120" cy="120" r="26" fill="none" stroke="#38bdf8" stroke-width="3" />
  <circle cx="120" cy="120" r="8" fill="#38bdf8" />

  <text x="120" y="330" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" fill="url(#titleGradient)">Project KAI</text>
  <text x="120" y="390" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="4" fill="#94a3b8">KAI OS</text>

  <text x="120" y="460" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="26" font-weight="500" fill="#cbd5e1">A modular AI operating system for automation,</text>
  <text x="120" y="496" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="26" font-weight="500" fill="#cbd5e1">research, content creation, and digital business.</text>

  <text x="120" y="562" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1" fill="#38bdf8">projectkai.dev</text>
</svg>
